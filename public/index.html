<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LunaWorld</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #090b18;
        color: #ffffff;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      .sky {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .stars {
        position: absolute;
        inset: 0 auto 0 -100vw;
        width: 200vw;
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.88) 0 1px, transparent 1.5px),
          radial-gradient(circle, rgba(180, 204, 255, 0.8) 0 1px, transparent 1.5px);
        background-position:
          0 0,
          50px 80px;
        background-size:
          180px 140px,
          240px 190px;
        opacity: 0.46;
        animation: drift-stars 72s linear infinite;
      }

      .clouds {
        position: absolute;
        inset: auto auto 8vh -100vw;
        width: 200vw;
        height: 36vh;
        background:
          radial-gradient(ellipse at 15% 68%, rgba(255, 255, 255, 0.11) 0 9%, transparent 25%),
          radial-gradient(ellipse at 32% 78%, rgba(136, 151, 196, 0.17) 0 12%, transparent 30%),
          radial-gradient(ellipse at 56% 72%, rgba(255, 255, 255, 0.1) 0 10%, transparent 27%),
          radial-gradient(ellipse at 78% 82%, rgba(118, 132, 174, 0.16) 0 13%, transparent 32%);
        filter: blur(10px);
        opacity: 0.78;
        animation: drift-clouds 96s linear infinite;
      }

      .content {
        position: relative;
        z-index: 1;
        max-width: 600px;
        padding: 40px;
      }

      h1 {
        font-size: 48px;
        margin-bottom: 10px;
      }

      p {
        color: #b8bdd6;
        font-size: 18px;
      }

      .moon {
        font-size: 64px;
        filter: drop-shadow(0 0 24px rgba(255, 222, 116, 0.28));
      }

      .status-panel {
        margin-top: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #d9def7;
        font-size: 16px;
      }

      .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #8c93ad;
        box-shadow: 0 0 16px rgba(140, 147, 173, 0.45);
      }

      .status-dot.active {
        background: #2ee66b;
        box-shadow: 0 0 18px rgba(46, 230, 107, 0.65);
      }

      .status-dot.inactive {
        background: #ff4d5f;
        box-shadow: 0 0 18px rgba(255, 77, 95, 0.6);
      }

      .service-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition:
          background 160ms ease,
          border-color 160ms ease,
          transform 160ms ease;
      }

      .service-link:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.42);
        transform: translateY(-1px);
      }

      .service-link.disabled {
        cursor: not-allowed;
        pointer-events: none;
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: rgba(255, 255, 255, 0.45);
        transform: none;
      }

      @keyframes drift-stars {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(50%);
        }
      }

      @keyframes drift-clouds {
        from {
          transform: translateX(0);
        }

        to {
          transform: translateX(50%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .stars,
        .clouds {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="sky" aria-hidden="true">
      <div class="stars"></div>
      <div class="clouds"></div>
    </div>

    <div class="content">
      <div class="moon">🌙</div>

      <h1>LunaWorld</h1>

      <p>Welcome, traveler.</p>

      <p>
        Check whether the LunaWorld Foundry instance is online before entering.
      </p>

      <div class="status-panel">
        <div class="status" aria-live="polite">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <span id="status-text">Checking LunaWorld Foundry status...</span>
        </div>

        <a
          class="service-link disabled"
          href="https://foundry.lunaworld.net/"
          id="foundry-link"
          aria-disabled="true"
          tabindex="-1"
        >
          Enter LunaWorld VTT
        </a>
      </div>

      <div class="status-panel">
        <div class="status" aria-live="polite">
          <span
            class="status-dot"
            id="mystics-adventure-status-dot"
            aria-hidden="true"
          ></span>
          <span id="mystics-adventure-status-text">
            Checking Mystics Adventure status...
          </span>
        </div>

        <a
          class="service-link disabled"
          href="https://mystics-adventure.lunaworld.net/"
          id="mystics-adventure-link"
          aria-disabled="true"
          tabindex="-1"
        >
          Play Mystics Adventure
        </a>
      </div>
    </div>

    <script>
      const statusDot = document.querySelector("#status-dot");
      const statusText = document.querySelector("#status-text");
      const foundryLink = document.querySelector("#foundry-link");
      const mysticsAdventureStatusDot = document.querySelector(
        "#mystics-adventure-status-dot",
      );
      const mysticsAdventureStatusText = document.querySelector(
        "#mystics-adventure-status-text",
      );
      const mysticsAdventureLink = document.querySelector(
        "#mystics-adventure-link",
      );

      function setServiceAvailability(link, isActive) {
        link.classList.toggle("disabled", !isActive);
        link.setAttribute("aria-disabled", String(!isActive));
        link.tabIndex = isActive ? 0 : -1;
      }

      async function updateFoundryStatus() {
        try {
          const response = await fetch("/api/foundry-status", {
            cache: "no-store",
          });

          if (!response.ok) {
            throw new Error("Status request failed");
          }

          const status = await response.json();
          statusDot.classList.toggle("active", status.active);
          statusDot.classList.toggle("inactive", !status.active);
          setServiceAvailability(foundryLink, status.active);
          statusText.textContent = status.active
            ? "LunaWorld Foundry is active"
            : "LunaWorld Foundry is inactive";
        } catch (error) {
          statusDot.classList.remove("active");
          statusDot.classList.add("inactive");
          setServiceAvailability(foundryLink, false);
          statusText.textContent = "LunaWorld Foundry is inactive";
        }
      }

      async function updateMysticsAdventureStatus() {
        try {
          const response = await fetch("/api/mystics-adventure-status", {
            cache: "no-store",
          });

          if (!response.ok) {
            throw new Error("Status request failed");
          }

          const status = await response.json();
          mysticsAdventureStatusDot.classList.toggle("active", status.active);
          mysticsAdventureStatusDot.classList.toggle(
            "inactive",
            !status.active,
          );
          setServiceAvailability(mysticsAdventureLink, status.active);
          mysticsAdventureStatusText.textContent = status.active
            ? "Mystics Adventure is active"
            : "Mystics Adventure is inactive";
        } catch (error) {
          mysticsAdventureStatusDot.classList.remove("active");
          mysticsAdventureStatusDot.classList.add("inactive");
          setServiceAvailability(mysticsAdventureLink, false);
          mysticsAdventureStatusText.textContent =
            "Mystics Adventure is inactive";
        }
      }

      updateFoundryStatus();
      updateMysticsAdventureStatus();
      setInterval(() => {
        updateFoundryStatus();
        updateMysticsAdventureStatus();
      }, 30000);
    </script>
  </body>
</html>

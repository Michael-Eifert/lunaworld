<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LunaWorld</title>

    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #090b18;
        color: #ffffff;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      .content {
        max-width: 600px;
        padding: 40px;
      }

      h1 {
        font-size: 48px;
        margin-bottom: 10px;
      }

      p {
        color: #b8bdd6;
        font-size: 18px;
      }

      .moon {
        font-size: 64px;
      }

      .status-panel {
        margin-top: 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #d9def7;
        font-size: 16px;
      }

      .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #8c93ad;
        box-shadow: 0 0 16px rgba(140, 147, 173, 0.45);
      }

      .status-dot.active {
        background: #2ee66b;
        box-shadow: 0 0 18px rgba(46, 230, 107, 0.65);
      }

      .status-dot.inactive {
        background: #ff4d5f;
        box-shadow: 0 0 18px rgba(255, 77, 95, 0.6);
      }

      .foundry-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 20px;
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.08);
        color: #ffffff;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        transition:
          background 160ms ease,
          border-color 160ms ease,
          transform 160ms ease;
      }

      .foundry-link:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.42);
        transform: translateY(-1px);
      }
    </style>
  </head>

  <body>
    <div class="content">
      <div class="moon">🌙</div>

      <h1>LunaWorld</h1>

      <p>Welcome, traveler.</p>

      <p>
        Check whether the LunaWorld Foundry instance is online before entering.
      </p>

      <div class="status-panel">
        <div class="status" aria-live="polite">
          <span class="status-dot" id="status-dot" aria-hidden="true"></span>
          <span id="status-text">Checking LunaWorld Foundry status...</span>
        </div>

        <a class="foundry-link" href="https://foundry.lunaworld.net/">
          Enter LunaWorld VTT
        </a>
      </div>
    </div>

    <script>
      const statusDot = document.querySelector("#status-dot");
      const statusText = document.querySelector("#status-text");

      async function updateFoundryStatus() {
        try {
          const response = await fetch("/api/foundry-status", {
            cache: "no-store",
          });

          if (!response.ok) {
            throw new Error("Status request failed");
          }

          const status = await response.json();
          statusDot.classList.toggle("active", status.active);
          statusDot.classList.toggle("inactive", !status.active);
          statusText.textContent = status.active
            ? "LunaWorld Foundry is active"
            : "LunaWorld Foundry is inactive";
        } catch (error) {
          statusDot.classList.remove("active");
          statusDot.classList.add("inactive");
          statusText.textContent = "LunaWorld Foundry is inactive";
        }
      }

      updateFoundryStatus();
      setInterval(updateFoundryStatus, 30000);
    </script>
  </body>
</html>
